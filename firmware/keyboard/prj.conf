CONFIG_GZLL=y
CONFIG_GAZELL=y

# --- Power management ---
CONFIG_NRFX_POWER=y

# --- Real-time Clock ---
CONFIG_NRFX_RTC0=y
CONFIG_NRFX_RTC1=y

# --- Logging ---
CONFIG_SERIAL=n
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_PROCESS_THREAD=y
CONFIG_UART_CONSOLE=n
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
